name: Feature request
description: Something a Lens plugin should do
labels: [enhancement]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin
      placeholder: Log Lens
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: Describe the task in front of you, not just the feature you have in mind. Both are welcome, the task matters more.
    validations:
      required: true
